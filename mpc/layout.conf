[tab MODULATION]
frame x=10 y=92 w=626 h=304 title="ENVELOPE"
knob cx=87 cy=246 r=46 label="ATTACK" key=attack
knob cx=245 cy=246 r=46 label="DECAY" key=decay
knob cx=403 cy=246 r=46 label="SUSTAIN" key=sustain
knob cx=561 cy=246 r=46 label="RELEASE" key=release
