# SK Filterbank pages for MPC OS (Force Shadow layout syntax, built by mpc-vst-plugins tools/shadow_skin.py; the
# knob artwork is then swapped for colour-coded knobs by mpc/skin_post.py).
# Plugin area 1280 x 628 (layout y 86..714). On every page each row is one Q-Link bank: the top row is Force
# knobs 1-8 of bank 1, the bottom row knobs 1-8 of bank 2. Knob names and values are drawn live by MPC.
# Look: the Filterbank 2's pale, faintly metallic silver-grey panel with black legends; red for selected switches.
theme_bg=c7cacc
theme_panel=bdc1c4
theme_line=7d8286
theme_ink=17181a
theme_ink_dim=3c3f42
theme_ink_faint=6f7377
theme_accent=17181a
theme_accent_hi=17181a
theme_knob_face=202124
theme_knob_ring=55595d
theme_knob_dot=f2f2f2
theme_seg_active=c4261d
theme_seg_inactive=a9adb0
theme_seg_active_tx=ffffff
theme_btn_bg=2a2c2f
theme_btn_text=f2f2f2
theme_btn_on=c4261d
theme_tab_on=c4261d
theme_tab_on_tx=ffffff
theme_lcd=1b1416
theme_display_bg=1b1012
theme_display_cell=2a181a
theme_display_ink=ff4433
theme_display_off=3a2023
theme_display_bezel=0c0809
qlinks_track = input,freq_1,reso_1,adsr_1,lbh_1,corr_1,par_ser,byp_eff,fm,freq_2,reso_2,adsr_2,lbh_2,corr_2,am,output

